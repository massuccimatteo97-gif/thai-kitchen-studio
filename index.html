<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Discover authentic Thai recipes, online cooking classes and the secrets of Thai cuisine with Thai Kitchen Studio.">
<title>Thai Kitchen Studio | Discover the Taste of Thailand</title>
<style>
:root {
  --green: #183e32;
  --cream: #faf7ef;
  --orange: #d98245;
  --dark: #252821;
  --muted: #6c7169;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: var(--cream);
  color: var(--dark);
  line-height: 1.6;
}
a { color: inherit; text-decoration: none; }
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 22px 7%;
  background: var(--cream);
  gap: 20px;
}
.logo { font-size: 21px; font-weight: 800; color: var(--green); }
.logo span { color: var(--orange); }
nav { display: flex; gap: 24px; align-items: center; font-size: 14px; }
nav a:hover { color: var(--orange); }
.button {
  display: inline-block;
  padding: 13px 22px;
  border-radius: 5px;
  background: var(--green);
  color: white;
  border: 0;
  font-weight: bold;
  cursor: pointer;
}
.button:hover { background: #285846; }
.hero {
  padding: 90px 7%;
  min-height: 510px;
  display: grid;
  grid-template-columns: 1.1fr .9fr;
  gap: 45px;
  align-items: center;
  background: #f1eadb;
}
.eyebrow {
  text-transform: uppercase;
  letter-spacing: 3px;
  color: #a65e30;
  font-size: 12px;
  font-weight: bold;
}
h1 { font-size: clamp(42px, 6vw, 70px); line-height: 1.05; margin: 18px 0; letter-spacing: -2px; }
h2 { font-size: clamp(30px, 4vw, 43px); line-height: 1.15; margin: 12px 0; }
p { color: var(--muted); }
.hero p { max-width: 480px; font-size: 17px; }
.hero-image {
  min-height: 350px;
  border-radius: 180px 180px 12px 12px;
  background: linear-gradient(145deg, #b7c1a0, #e6c48d 50%, #b75c34);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 100px;
  box-shadow: 15px 15px 0 #e3d5bd;
}
section { padding: 76px 7%; }
.section-heading { max-width: 650px; margin-bottom: 35px; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.card {
  background: white;
  border-radius: 9px;
  overflow: hidden;
  border: 1px solid #eee8dd;
}
.card-art {
  min-height: 175px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 65px;
  background: #e9dfc9;
}
.card:nth-child(2) .card-art { background: #e0e8d9; }
.card:nth-child(3) .card-art { background: #f2d9c4; }
.card-content { padding: 23px; }
.card h3 { margin: 0 0 8px; font-size: 21px; }
.tag { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: #a65e30; font-weight: bold; }
.price { color: var(--green); font-size: 22px; font-weight: bold; margin: 15px 0; }
.light { background: #eee9dc; }
.split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 55px;
  align-items: center;
}
.feature-art {
  min-height: 330px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #d8dfcb;
  border-radius: 8px;
  font-size: 100px;
}
ul { padding-left: 20px; color: var(--muted); }
li { margin-bottom: 10px; }
.cta {
  text-align: center;
  background: var(--green);
  color: white;
  padding: 75px 7%;
}
.cta p { color: #e0e8df; max-width: 580px; margin: 15px auto 25px; }
.cta h2 { max-width: 700px; margin: auto; }
.cta .button { background: var(--orange); }
.newsletter { max-width: 550px; margin: 25px auto 0; display: flex; gap: 8px; }
.newsletter input {
  min-width: 0;
  flex: 1;
  padding: 13px;
  border: 1px solid #d8d2c5;
  border-radius: 5px;
  font-size: 15px;
}
footer {
  padding: 35px 7%;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--muted);
}
.notice { font-size: 12px; margin-top: 18px; opacity: .8; }
@media(max-width: 760px) {
  header { padding: 18px 5%; flex-wrap: wrap; }
  nav { width: 100%; gap: 16px; flex-wrap: wrap; font-size: 13px; }
  .hero { grid-template-columns: 1fr; padding: 55px 6%; }
  .hero-image { min-height: 240px; font-size: 75px; }
  section { padding: 55px 6%; }
  .cards, .split { grid-template-columns: 1fr; }
  .newsletter { flex-direction: column; }
  h1 { letter-spacing: -1px; }
}
</style>
</head>
<body>
